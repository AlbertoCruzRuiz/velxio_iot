# Velxio IoT — Development Docker Compose
# Uses precompiled QEMU and ESP-IDF images from GHCR.
#
# Build: docker compose build --pull velxio
# Start: docker compose up -d velxio
# Access: http://localhost:3080
#
# backend/.env is optional.
# QEMU_IMAGE and ESPIDF_IMAGE can be overridden
# through environment variables or a Compose .env file.

services:
  velxio:
    build:
      context: .
      dockerfile: Dockerfile.standalone
      pull: true
      args:
        QEMU_IMAGE: ${QEMU_IMAGE:-ghcr.io/albertocruzruiz/velxio-qemu:latest}
        ESPIDF_IMAGE: ${ESPIDF_IMAGE:-ghcr.io/albertocruzruiz/velxio-espidf-toolchain:idf-5.5.5-arduino-3.3.12}

    platform: linux/amd64
    container_name: velxio-iot-dev
    restart: unless-stopped

    ports:
      - "3080:80"

    env_file:
      - path: ./backend/.env
        required: false

    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/velxio.db
      - DATA_DIR=/app/data
      - IDF_PATH=/opt/esp-idf
      - IDF_TOOLS_PATH=/root/.espressif
      - ARDUINO_ESP32_PATH=/opt/arduino-esp32

      # ESP-IDF compilation cache
      - IDF_CCACHE_ENABLE=1
      - CCACHE_DIR=/var/cache/ccache

      # Incremental ESP-IDF builds
      - VELXIO_PERSISTENT_BUILD_DIR=1

    volumes:
      # Database and user projects
      - ./data:/app/data

      # Arduino cores and board indexes
      - arduino-libs:/root/.arduino15

      # Persistent compilation caches
      - ccache:/var/cache/ccache
      - velxio-build:/var/lib/velxio-build

      # User-installed Arduino libraries
      - arduino-user-libs:/root/Arduino

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  arduino-libs:
  ccache:
  velxio-build:
  arduino-user-libs:
