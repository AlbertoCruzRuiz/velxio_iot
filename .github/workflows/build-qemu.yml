name: Build QEMU Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.qemu'
      - 'third-party/velxio-qemu'
      - '.gitmodules'
      - 'qemu-assets/roms/**'
      - '.github/workflows/build-qemu.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-qemu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-qemu:
    name: Build, Validate and Publish QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Checkout pinned QEMU submodule
        shell: bash
        env:
          QEMU_REPO_READ_TOKEN: ${{ secrets.QEMU_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          # If the QEMU source repository is private, provide a fine-grained
          # PAT with read-only Contents access to that repository.
          if [[ -n "$QEMU_REPO_READ_TOKEN" ]]; then
            auth="$(printf 'x-access-token:%s' "$QEMU_REPO_READ_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              submodule update --init --depth 1 third-party/velxio-qemu
          else
            git submodule update --init --depth 1 third-party/velxio-qemu
          fi

      - name: Validate source and ROM inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s third-party/velxio-qemu/build_libqemu-esp32.sh
          (
            cd qemu-assets/roms
            sha256sum -c SHA256SUMS
          )
          echo "QEMU source: $(git -C third-party/velxio-qemu rev-parse HEAD)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare image tags
        id: meta
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/velxio-qemu"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${image}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, validate and publish QEMU image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile.qemu
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=qemu
          cache-to: type=gha,scope=qemu,mode=min

      - name: Summarize published image
        run: |
          echo '### Published QEMU image' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.version }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Contains /qemu/ with libraries and ROM files.' >> "$GITHUB_STEP_SUMMARY"
