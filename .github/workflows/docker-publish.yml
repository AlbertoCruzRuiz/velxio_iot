name: Build and Publish Velxio IoT Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

  # Permite recibir actualizaciones desde velxio-qemu.
  repository_dispatch:
    types:
      - qemu-published

permissions:
  contents: read
  packages: write

concurrency:
  group: velxio-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VELXIO_IMAGE: ghcr.io/albertocruzruiz/velxio_iot
  DEFAULT_QEMU_IMAGE: ghcr.io/albertocruzruiz/velxio-qemu:latest
  ESPIDF_IMAGE: ghcr.io/albertocruzruiz/velxio-espidf-toolchain:idf-5.5.5-arduino-3.3.12

jobs:
  build-velxio:
    name: Build Velxio (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Velxio
        uses: actions/checkout@v4

      - name: Select QEMU image
        id: qemu
        shell: bash
        env:
          DISPATCH_QEMU: ${{ github.event.client_payload.qemu_image }}
        run: |
          set -euo pipefail

          image="${DEFAULT_QEMU_IMAGE}"

          if [[ -n "${DISPATCH_QEMU}" ]]; then
            case "${DISPATCH_QEMU}" in
              ghcr.io/albertocruzruiz/velxio-qemu:sha-*)
                image="${DISPATCH_QEMU}"
                ;;
              *)
                echo "::error::Invalid QEMU image"
                exit 1
                ;;
            esac
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "QEMU image: ${image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify dependency images
        shell: bash
        env:
          QEMU_IMAGE: ${{ steps.qemu.outputs.image }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect \
            "${QEMU_IMAGE}"

          docker buildx imagetools inspect \
            "${ESPIDF_IMAGE}"

      - name: Build and publish Velxio
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.standalone
          platforms: linux/amd64
          pull: true
          push: true

          tags: |
            ${{ env.VELXIO_IMAGE }}:latest
            ${{ env.VELXIO_IMAGE }}:sha-${{ github.sha }}

          build-args: |
            QEMU_IMAGE=${{ steps.qemu.outputs.image }}
            ESPIDF_IMAGE=${{ env.ESPIDF_IMAGE }}

          cache-from: type=gha,scope=velxio
          cache-to: type=gha,scope=velxio,mode=min
          provenance: mode=min

      - name: Build summary
        shell: bash
        env:
          QEMU_IMAGE: ${{ steps.qemu.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Velxio IoT build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- QEMU: \`${QEMU_IMAGE}\`"
            echo "- ESP-IDF: \`${ESPIDF_IMAGE}\`"
            echo "- Published: \`${VELXIO_IMAGE}:latest\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
